{% extends "layout.html" %}
{% block content %}
<section
  class="dashboard-loading-shell trips-loading-shell"
  data-trips-content-url="{{ trips_content_url }}"
  aria-busy="true"
>
  <div class="loading-overlay-card" role="status" aria-live="polite">
    <span class="loading-spinner" aria-hidden="true"></span>
    <div>
      <h1>Work Trips</h1>
      <p>Loading selected-month cards and work trip records.</p>
    </div>
  </div>
</section>
<noscript>
  <section class="panel">
    <h2>JavaScript Required</h2>
    <p>The Work Trips page loads selected-month totals and work trip rows after the initial page opens.</p>
  </section>
</noscript>
<script>
  (() => {
    const bindTripMonthSelector = () => {
      const monthInput = document.querySelector("[data-trip-month-form] input[type='month']");
      if (!monthInput || monthInput.dataset.tripsBound === "true") {
        return;
      }
      monthInput.dataset.tripsBound = "true";
      monthInput.addEventListener("change", () => {
        if (!monthInput.value || !monthInput.checkValidity()) {
          return;
        }
        const [year, month] = monthInput.value.split("-");
        window.location.assign(`/trips?year=${encodeURIComponent(year)}&month=${encodeURIComponent(month)}`);
      });
    };

    // A PDF response normally leaves the current page open. Refresh it after the
    // download starts so the submission control reflects server-recorded evidence.
    document.addEventListener("submit", async (event) => {
      const form = event.target;
      if (!form.matches("[data-report-download]")) return;
      event.preventDefault();
      const button = form.querySelector("button");
      const status = document.querySelector("[data-report-status]");
      button.disabled = true;
      try {
        const response = await fetch(form.action, {
          method: "POST", credentials: "same-origin", cache: "no-store",
        });
        if (!response.ok || !response.headers.get("Content-Type")?.includes("application/pdf")) {
          throw new Error("PDF report could not be downloaded. Refresh and try again.");
        }
        const file = await response.blob();
        const downloadUrl = URL.createObjectURL(file);
        const link = document.createElement("a");
        link.href = downloadUrl;
        const disposition = response.headers.get("Content-Disposition") || "";
        link.download = disposition.match(/filename="([^"]+)"/)?.[1] || "trip-report.pdf";
        document.body.appendChild(link);
        link.click();
        link.remove();
        // Release the URL only after the browser has started reading the download.
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
        window.location.reload();
      } catch (error) {
        if (status) status.textContent = error.message;
        button.disabled = false;
      }
    });

    const shell = document.querySelector(".trips-loading-shell");
    if (!shell) {
      return;
    }
    const contentUrl = shell.dataset.tripsContentUrl;
    const renderError = () => {
      shell.setAttribute("aria-busy", "false");
      shell.innerHTML = `
        <section class="panel">
          <h2>Work Trips Could Not Load</h2>
          <p class="panel-meta">Refresh the page to try loading the Work Trips page again.</p>
        </section>
      `;
    };
    fetch(contentUrl, {
      credentials: "same-origin",
      headers: { "X-Requested-With": "fetch" },
      cache: "no-store",
    })
      .then((response) => {
        if (response.headers.get("X-Trip-Tracker-Limp-Mode") === "true") {
          window.location.replace("/");
          return "";
        }
        if (!response.ok) {
          throw new Error(`Work Trips content request failed: ${response.status}`);
        }
        return response.text();
      })
      .then((html) => {
        if (!html) {
          return;
        }
        shell.setAttribute("aria-busy", "false");
        shell.outerHTML = html;
        bindTripMonthSelector();
      })
      .catch(renderError);
  })();
</script>
{% endblock %}
